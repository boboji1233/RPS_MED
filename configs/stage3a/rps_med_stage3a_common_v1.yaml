seeds: [20260826, 20260827, 20260828]

pretraining:
  architecture: torchvision_resnet18
  weights: IMAGENET1K_V1
  sha256: f37072fd47e89c5e827621c5baffa7500819f7896bbacec160b1a16c560e07ec

augmentation:
  horizontal_flip_probability: 0.5
  vertical_flip_probability: 0.5
  rotations_degrees: [0, 90, 180, 270]
  brightness_range: [0.9, 1.1]
  contrast_range: [0.9, 1.1]
  saturation_range: [0.9, 1.1]
  validation_augmentation: NONE

encoder_training:
  batch_size: 8
  max_epochs: 40
  encoder_lr: 0.0001
  head_lr: 0.0005
  weight_decay: 0.0001
  optimizer: ADAMW
  scheduler: COSINE_ANNEALING
  burden_loss: STANDARDIZED_SMOOTH_L1
  burden_huber_beta: 0.5
  burden_loss_weight: 1.0
  presence_loss: BINARY_CROSS_ENTROPY_WITH_LOGITS
  presence_loss_weight: 0.25
  early_stopping_by_contract:
    burden_only: MAX_VALIDATION_MULTISCALE_MACRO_F1_FROM_ANALYTIC_RELATIONS
    burden_presence: MAX_VALIDATION_MULTISCALE_MACRO_F1_FROM_ANALYTIC_RELATIONS
    burden_presence_no_geometry: MAX_VALIDATION_MULTISCALE_MACRO_F1_FROM_ANALYTIC_RELATIONS
    presence_only: MIN_VALIDATION_PRESENCE_BINARY_CROSS_ENTROPY
  early_stopping_patience: 8
  early_stopping_min_delta: 0.001
  amp: true

pair_training:
  hidden_dimensions: [512, 256]
  dropout: 0.20
  batch_size: 1024
  max_epochs: 100
  learning_rate: 0.001
  weight_decay: 0.0001
  optimizer: ADAMW
  scheduler: COSINE_ANNEALING
  spectrum_loss: CLASS_WEIGHTED_CROSS_ENTROPY
  maximum_class_weight: 5.0
  transition_loss_weight: 0.25
  critical_loss_weight: 0.25
  critical_huber_beta: 0.5
  soft_admissibility_weight: 0.05
  early_stopping_metric: VALIDATION_MULTISCALE_MACRO_F1
  early_stopping_patience: 12
  early_stopping_min_delta: 0.001
  amp: true

metrics:
  primary: SEVENTEEN_SCALE_EQUALLY_WEIGHTED_MEAN_MACRO_F1
  secondary: [RELATION_ACCURACY, PHASE_TOTAL_VARIATION, PER_STATE_F1, TRANSITION_ROC_AUC, CRITICAL_LOG2_MAE_TRUE_TRANSITION_PAIRS, PAIR_SWAP_CONSISTENCY, INVALID_SPECTRUM_RATE, MULTI_TRANSITION_RATE, PEAK_CUDA_VRAM, WALL_CLOCK_RUNTIME, PARAMETER_COUNT]
  statistical_unit: VALIDATION_UNIQUE_CONTENT_NODE
  pair_row_bootstrap: FORBIDDEN
  per_state_f1: POOLED_OVER_ALL_VALIDATION_PAIR_SCALE_ROWS

runtime:
  device: cuda
  deterministic_algorithms: true
  num_workers: 0
  automatic_retry: false
  append_only: true
